spring.application.name=ecommercelibros
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Base de datos H2 (en memoria) ---
spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.username=sa
spring.datasource.password=


# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false


# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT ---
# Mínimo 32 caracteres (256 bits). En producción, define la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:ecommerce-libros-clave-secreta-2026}
# Minutos de vida del token
jwt.expiry=60

# --- Administrador inicial (se crea al arrancar si no existe) ---
app.seed.admin.correo=admin@libros.com
app.seed.admin.contrasenia=${ADMIN_PASSWORD:Admin12345}